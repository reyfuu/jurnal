<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laporan Bisnis — by Akademi Pajak</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-outer: #090a0c;
      --bg-shell: #0f1115;
      --bg-sidebar: #111318;
      --bg-card: #15181e;
      --bg-card-hover: #191d24;
      --border-subtle: rgba(255, 255, 255, 0.06);
      --border-shell: rgba(255, 255, 255, 0.09);
      --text-primary: #f4f5f7;
      --text-secondary: #949ba6;
      --text-muted: #616875;
      --accent-amber: #eab308;
      --accent-amber-bright: #f5c428;
      --accent-amber-soft: rgba(234, 179, 8, 0.14);
      --accent-green: #10b981;
      --accent-green-soft: rgba(16, 185, 129, 0.14);
      --accent-blue: #38bdf8;
      --accent-orange: #d97706;
      --accent-red: #f43f5e;
      --accent-red-soft: rgba(244, 63, 94, 0.14);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-outer);
      color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    .tabular {
      font-variant-numeric: tabular-nums;
    }

    /* Top Marketing Navbar */
    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 40px;
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(9, 10, 12, 0.88);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text-primary);
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-title {
      font-weight: 700;
      font-size: 16px;
      line-height: 1.15;
      letter-spacing: -0.02em;
    }

    .brand-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-secondary);
      letter-spacing: 0.04em;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .nav-links a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: color 0.15s ease;
    }

    .nav-links a:hover {
      color: var(--text-primary);
    }

    .btn-ghost {
      padding: 9px 20px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.02);
      color: var(--text-primary);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-cta {
      padding: 10px 22px;
      border-radius: 999px;
      border: none;
      background: var(--accent-amber-bright);
      color: #090a0c;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .btn-cta:hover {
      filter: brightness(1.06);
      transform: translateY(-1px);
    }

    /* Main Framed Application Window */
    .frame-wrapper {
      max-width: 1380px;
      margin: 28px auto 48px;
      padding: 0 24px;
    }

    .app-shell {
      display: grid;
      grid-template-columns: 232px 1fr;
      background: var(--bg-shell);
      border: 1px solid var(--border-shell);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.65);
      min-height: 860px;
    }

    /* Sidebar */
    .sidebar {
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-subtle);
      padding: 22px 14px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 10px 18px;
    }

    .nav-group {
      margin-top: 14px;
    }

    .nav-group-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--text-muted);
      padding: 0 10px 6px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 8px 10px;
      border-radius: 9px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: all 0.14s ease;
    }

    .nav-item:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.03);
    }

    .nav-item.active {
      background: rgba(234, 179, 8, 0.13);
      color: #facc15;
      font-weight: 600;
    }

    .nav-icon {
      width: 15px;
      height: 15px;
      opacity: 0.85;
      flex-shrink: 0;
    }

    .tenant-box {
      margin-top: 20px;
      padding-top: 14px;
      border-top: 1px solid var(--border-subtle);
    }

    .tenant-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      background: rgba(255,255,255,0.025);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
    }

    .tenant-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(234, 179, 8, 0.2);
      color: #facc15;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .tenant-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .tenant-meta {
      font-size: 10.5px;
      color: var(--text-muted);
    }

    .demo-caption {
      font-size: 10.5px;
      color: var(--text-muted);
      padding: 8px 6px 0;
    }

    /* Main Workspace Content */
    .workspace {
      padding: 26px 28px 32px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .workspace-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .workspace-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .workspace-subtitle {
      font-size: 12.5px;
      color: var(--text-secondary);
      margin-top: 3px;
    }

    .period-select {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border-shell);
      color: var(--text-primary);
      padding: 8px 14px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }

    /* 6 KPI Grid */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 12px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 15px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 0.15s ease;
    }

    .card:hover {
      border-color: rgba(255, 255, 255, 0.12);
    }

    .kpi-label {
      font-size: 11.5px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .kpi-value {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin: 6px 0 8px;
    }

    .kpi-meta-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .badge-up {
      display: inline-flex;
      align-items: center;
      padding: 2px 6px;
      border-radius: 999px;
      background: var(--accent-green-soft);
      color: #34d399;
      font-weight: 700;
      font-size: 10.5px;
    }

    .pts-up {
      color: #34d399;
      font-weight: 700;
    }

    .sparkline-svg {
      width: 100%;
      height: 28px;
      overflow: visible;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: rgba(255,255,255,0.07);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress-bar {
      height: 100%;
      background: #22c55e;
      border-radius: 999px;
    }

    .overdue-alert {
      color: var(--accent-red);
      font-size: 11px;
      font-weight: 600;
      margin-top: 4px;
    }

    .payable-note {
      color: var(--text-muted);
      font-size: 10.5px;
      margin-top: 4px;
      line-height: 1.35;
    }

    /* Middle Charts Grid */
    .charts-middle {
      display: grid;
      grid-template-columns: 1.85fr 1fr;
      gap: 14px;
    }

    .right-charts-stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .chart-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .chart-subtitle {
      font-size: 11.5px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 12px;
      margin-bottom: 8px;
      font-size: 11px;
      color: var(--text-secondary);
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block;
    }

    /* Bottom Row */
    .bottom-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .list-rows {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .list-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12.5px;
      padding: 7px 10px;
      background: rgba(255,255,255,0.02);
      border-radius: 8px;
    }

    /* Sub-views (Transaksi, Pajak UMKM, Simulasi, dll.) */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 13px;
    }

    .data-table th {
      text-align: left;
      padding: 10px 12px;
      color: var(--text-secondary);
      font-weight: 600;
      border-bottom: 1px solid var(--border-shell);
      font-size: 11.5px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .data-table td {
      padding: 11px 12px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .input-field {
      background: #0d0f13;
      border: 1px solid var(--border-shell);
      color: var(--text-primary);
      padding: 9px 12px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 13px;
      width: 100%;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 12px;
    }

    .pill-status {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }

    .pill-green {
      background: var(--accent-green-soft);
      color: #34d399;
    }

    .pill-red {
      background: var(--accent-red-soft);
      color: #fb7185;
    }

    .pill-amber {
      background: var(--accent-amber-soft);
      color: #facc15;
    }

    @media (max-width: 1150px) {
      .kpi-grid {
        grid-template-columns: repeat(3, 1fr);
      }
      .charts-middle {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

  <script>
    let appState = null;
    let currentView = 'dashboard';

    function formatRpFull(num) {
      const sign = num < 0 ? '-' : '';
      const abs = Math.abs(num);
      return sign + 'Rp' + abs.toLocaleString('id-ID');
    }

    function buildSparklinePath(values, width, height, color) {
      if (!values || values.length < 2) return '';
      const min = Math.min(...values);
      const max = Math.max(...values);
      const range = max - min || 1;
      const pts = values.map((v, idx) => {
        const x = (idx / (values.length - 1)) * width;
        const y = height - 4 - ((v - min) / range) * (height - 8);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      });
      return `<svg class="sparkline-svg" viewBox="0 0 ${width} ${height}">
        <polyline fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" points="${pts.join(' ')}" />
      </svg>`;
    }

    function buildMain11MonthChart(points) {
      const w = 640, h = 250, padL = 44, padR = 16, padT = 16, padB = 28;
      const plotW = w - padL - padR;
      const plotH = h - padT - padB;
      const maxVal = 100_000_000;

      const xAt = (i) => padL + (i / (points.length - 1)) * plotW;
      const yAt = (val) => padT + plotH - (val / maxVal) * plotH;

      const makeSmoothPath = (key) => {
        return points.map((p, i) => {
          const x = xAt(i);
          const y = yAt(p[key]);
          if (i === 0) return `M ${x.toFixed(1)} ${y.toFixed(1)}`;
          const prevX = xAt(i - 1);
          const prevY = yAt(points[i - 1][key]);
          const cx1 = prevX + (x - prevX) * 0.45;
          const cx2 = prevX + (x - prevX) * 0.55;
          return `C ${cx1.toFixed(1)} ${prevY.toFixed(1)}, ${cx2.toFixed(1)} ${y.toFixed(1)}, ${x.toFixed(1)} ${y.toFixed(1)}`;
        }).join(' ');
      };

      const omzetLine = makeSmoothPath('omzet');
      const biayaLine = makeSmoothPath('total_biaya');
      const labaLine = makeSmoothPath('laba_bersih');

      const lastX = xAt(points.length - 1);
      const baseLine = `L ${lastX.toFixed(1)} ${(padT + plotH).toFixed(1)} L ${padL} ${(padT + plotH).toFixed(1)} Z`;

      const yGrid = [0, 25_000_000, 50_000_000, 75_000_000, 100_000_000].map(v => {
        const y = yAt(v);
        const label = v === 0 ? '0' : `${v / 1_000_000} jt`;
        return `
          <line x1="${padL}" y1="${y}" x2="${w - padR}" y2="${y}" stroke="rgba(255,255,255,0.05)" stroke-dasharray="2 3" />
          <text x="${padL - 8}" y="${y + 4}" text-anchor="end" fill="#616875" font-size="10">${label}</text>
        `;
      }).join('');

      const xLabels = points.map((p, i) => {
        return `<text x="${xAt(i)}" y="${h - 6}" text-anchor="middle" fill="#616875" font-size="10">${p.month}</text>`;
      }).join('');

      const lastPt = points[points.length - 1];

      return `
      <svg viewBox="0 0 ${w} ${h}" style="width:100%; height:265px; display:block; margin-top:6px;">
        <defs>
          <linearGradient id="gradOmzet" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#eab308" stop-opacity="0.28"/>
            <stop offset="100%" stop-color="#eab308" stop-opacity="0.02"/>
          </linearGradient>
          <linearGradient id="gradLaba" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#10b981" stop-opacity="0.26"/>
            <stop offset="100%" stop-color="#10b981" stop-opacity="0.01"/>
          </linearGradient>
        </defs>
        ${yGrid}
        <path d="${omzetLine} ${baseLine}" fill="url(#gradOmzet)" />
        <path d="${labaLine} ${baseLine}" fill="url(#gradLaba)" />
        <path d="${omzetLine}" fill="none" stroke="#eab308" stroke-width="2.2" />
        <path d="${biayaLine}" fill="none" stroke="#d97706" stroke-width="1.8" />
        <path d="${labaLine}" fill="none" stroke="#10b981" stroke-width="2.2" />
        <circle cx="${lastX}" cy="${yAt(lastPt.omzet)}" r="3.5" fill="#eab308" />
        <circle cx="${lastX}" cy="${yAt(lastPt.total_biaya)}" r="3.5" fill="#d97706" />
        <circle cx="${lastX}" cy="${yAt(lastPt.laba_bersih)}" r="3.5" fill="#10b981" />
        ${xLabels}
      </svg>`;
    }

    function buildDailyBarChart(days, target) {
      const w = 340, h = 115, padL = 24, padR = 8, padT = 10, padB = 18;
      const plotW = w - padL - padR;
      const plotH = h - padT - padB;
      const maxVal = 6_000_000;
      const yTarget = padT + plotH - (target / maxVal) * plotH;
      const barW = Math.max(4, (plotW / days.length) - 3);

      const bars = days.map((d, i) => {
        const x = padL + i * (plotW / days.length);
        const bh = (d.omzet / maxVal) * plotH;
        const y = padT + plotH - bh;
        const fill = d.above_target ? '#eab308' : '#785c12';
        return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${bh.toFixed(1)}" rx="1.5" fill="${fill}" />`;
      }).join('');

      return `
      <svg viewBox="0 0 ${w} ${h}" style="width:100%; height:120px; display:block;">
        <text x="0" y="${padT + 4}" fill="#616875" font-size="9">6 jt</text>
        <text x="0" y="${yTarget + 3}" fill="#616875" font-size="9">3 jt</text>
        <text x="0" y="${padT + plotH}" fill="#616875" font-size="9">0</text>
        ${bars}
        <line x1="${padL}" y1="${yTarget}" x2="${w - padR}" y2="${yTarget}" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3" />
        <text x="${w - padR - 2}" y="${yTarget - 4}" text-anchor="end" fill="#cbd5e1" font-size="8.5">Target Rp3 jt</text>
        <text x="${padL + 14}" y="${h - 3}" fill="#616875" font-size="9">5</text>
        <text x="${padL + 65}" y="${h - 3}" fill="#616875" font-size="9">10</text>
        <text x="${padL + 115}" y="${h - 3}" fill="#616875" font-size="9">15</text>
        <text x="${padL + 165}" y="${h - 3}" fill="#616875" font-size="9">20</text>
        <text x="${padL + 215}" y="${h - 3}" fill="#616875" font-size="9">25</text>
        <text x="${padL + 265}" y="${h - 3}" fill="#616875" font-size="9">30</text>
      </svg>`;
    }

    function buildCashMonthlyChart(points) {
      const w = 340, h = 110, padL = 28, padR = 10, padT = 10, padB = 20;
      const plotW = w - padL - padR;
      const plotH = h - padT - padB;
      const maxVal = 110_000_000;
      const xAt = (i) => padL + (i / (points.length - 1)) * plotW;
      const yAt = (v) => padT + plotH - (v / maxVal) * plotH;

      const line = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${xAt(i).toFixed(1)} ${yAt(p.ending_cash).toFixed(1)}`).join(' ');
      const lastX = xAt(points.length - 1);
      const area = `${line} L ${lastX.toFixed(1)} ${(padT + plotH).toFixed(1)} L ${padL} ${(padT + plotH).toFixed(1)} Z`;

      return `
      <svg viewBox="0 0 ${w} ${h}" style="width:100%; height:112px; display:block;">
        <defs>
          <linearGradient id="gradCash" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.32"/>
            <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.02"/>
          </linearGradient>
        </defs>
        <text x="0" y="${padT + 6}" fill="#616875" font-size="9">100 jt</text>
        <text x="0" y="${padT + plotH / 2}" fill="#616875" font-size="9">50 jt</text>
        <text x="0" y="${padT + plotH}" fill="#616875" font-size="9">0</text>
        <path d="${area}" fill="url(#gradCash)" />
        <path d="${line}" fill="none" stroke="#38bdf8" stroke-width="2" />
        <circle cx="${lastX}" cy="${yAt(points[points.length - 1].ending_cash)}" r="3.2" fill="#38bdf8" />
      </svg>`;
    }

    function renderGenericModule(title, subtitle) {
      return `
        <div class="workspace-header">
          <div>
            <h1 class="workspace-title">${title}</h1>
            <p class="workspace-subtitle">${subtitle}</p>
          </div>
        </div>
        <div class="card" style="padding:20px;">
          <div class="chart-title">Stok Bahan Baku &amp; Produk Jadi (Kedai Kopi Senja)</div>
          <table class="data-table tabular">
            <thead>
              <tr>
                <th>SKU</th>
                <th>Nama Item</th>
                <th>Kategori</th>
                <th>Stok / Resep</th>
                <th>HPP / Unit</th>
                <th>Harga Jual</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              ${appState.inventory.map(item => `
                <tr>
                  <td style="color:var(--text-muted);">${item.sku}</td>
                  <td style="font-weight:600;">${item.name}</td>
                  <td>${item.type}</td>
                  <td>${item.stock}</td>
                  <td>${formatRpFull(item.cogs)}</td>
                  <td>${item.sell_price > 0 ? formatRpFull(item.sell_price) : '-'}</td>
                  <td><span class="pill-status ${item.status.includes('Menipis') ? 'pill-red' : 'pill-green'}">${item.status}</span></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function switchView(view) {
      currentView = view;
      document.querySelectorAll('.nav-item').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-view') === view);
      });
      renderCurrentView();
    }

    function renderCurrentView() {
      if (!appState) return;
      const root = document.getElementById('workspace-root');
      if (currentView === 'dashboard') {
        root.innerHTML = renderDashboard();
      } else if (currentView === 'pajak-umkm') {
        root.innerHTML = renderTaxUMKM();
      } else if (currentView === 'simulasi-harga') {
        root.innerHTML = renderSimulasiHarga();
      } else if (currentView === 'transaksi') {
        root.innerHTML = renderTransaksi();
      } else if (currentView === 'piutang-utang' || currentView === 'invoice') {
        root.innerHTML = renderPiutangUtang();
      } else if (currentView === 'arus-kas') {
        root.innerHTML = renderArusKas();
      } else if (currentView === 'laporan-keuangan') {
        root.innerHTML = renderLaporanKeuangan();
      } else {
        root.innerHTML = renderGenericModule(
          currentView.replace('-', ' ').toUpperCase(),
          'Data Master, Resep BOM, Stok Gudang & Panduan Akademi Pajak'
        );
      }
    }

    function updateSidebarTenant() {
      if (!appState) return;
      document.getElementById('tenant-initials').textContent = appState.tenant.initials;
      document.getElementById('tenant-name').textContent = appState.tenant.name;
      document.getElementById('tenant-meta').textContent =
        `${appState.tenant.category} · ${appState.tenant.total_transactions.toLocaleString('id-ID')} transaksi`;
    }

    function openCheckoutModal() {
      alert('Laporan Bisnis by Akademi Pajak — Akses Penuh Rp149.000 (Siap untuk 100 UMKM Batch Pertama).');
    }

    async function boot() {
      const [dash, fin, cash] = await Promise.all([
        fetch('/api/v1/dashboard?period=2026-08').then(r => r.json()),
        fetch('/api/v1/reports/financial?period=2026-08').then(r => r.json()),
        fetch('/api/v1/reports/cashflow?period=2026-08').then(r => r.json()),
      ]);
      appState = dash;
      appState.report = fin;
      appState.cash = cash;
      updateSidebarTenant();
      renderCurrentView();
    }

    boot();
  </script>
